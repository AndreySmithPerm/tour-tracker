version: '3.8'

services:
  # ===== Nginx (entry point) =====
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tour-tracker-nginx
    restart: always
    ports:
      # 127.0.0.1 — порт доступен ТОЛЬКО локально, из интернета не достучаться
      # Это позволяет запускать параллельно с другим проектом на портах 80/443
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - BOT_URL=${BOT_URL}
      - BOT_HANDLE=${BOT_HANDLE}
    volumes:
      # SSL certificates (mount from host)
      - ./deploy/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt certs
      - certbot-etc:/etc/letsencrypt
      # Let's Encrypt challenge
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    networks:
      - internal
      - external

  # ===== Go Application =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tour-tracker-app
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: tour-tracker-db
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
      - /run:noexec

  # ===== Redis (caching + rate limiting) =====
  redis:
    image: redis:7-alpine
    container_name: tour-tracker-redis
    restart: always
    expose:
      - "6379"
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m

  # ===== Backup service (daily pg_dump to S3) =====
  backup:
    image: postgres:16-alpine
    container_name: tour-tracker-backup
    restart: unless-stopped
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - PG_HOST=postgres
      - PG_USER=${DB_USER}
      - PG_DB=${DB_NAME}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
    volumes:
      - backup-data:/backups
    entrypoint: >
      sh -c '
        apk add --no-cache aws-cli cron
        echo "0 2 * * * pg_dump -h postgres -U ${DB_USER} ${DB_NAME} | gzip > /backups/backup_\$(date +\%Y\%m\%d\%H\%M\%S).sql.gz && aws s3 cp /backups/backup_\$(date +\%Y\%m\%d\%H\%M\%S).sql.gz s3://${S3_BUCKET}/ && find /backups -mtime +7 -delete" | crontab - && crond -f
      '
    networks:
      - internal

  # ===== Certbot (SSL certificates) =====
  certbot:
    image: certbot/certbot
    container_name: tour-tracker-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - external

volumes:
  pgdata:
  redisdata:
  backup-data:
  certbot-etc:
  certbot-www:

networks:
  internal:
    driver: bridge
    # internal: true  # Uncomment to isolate from external network
  external:
    driver: bridge
